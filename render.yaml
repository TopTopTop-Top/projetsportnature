services:
  # Web Service Node : doit être redéployé quand src/routes/api.js change (ex. PATCH traces).
  # Si les box passent mais pas les traces, ce service tourne souvent une vieille image sans ces routes.
  - type: web
    name: ravitobox-api
    branch: main
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      # Relier la Postgres Render (External/Internal Database URL) :
      - key: DATABASE_URL
        sync: false
      # Optionnel — sans clé, paiements restent en mode simulé (bêta OK) :
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Optionnel — sans SMTP, code reset mdp loggé côté serveur :
      - key: SMTP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optionnel — sans bucket, GPX en local (perdu au redeploy Render) :
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

  - type: static_site
    name: ravitobox-web
    branch: main
    rootDir: mobile
    buildCommand: npm install && npm run build:web
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    # Doit être l’URL du Web Service Node (JSON), jamais l’URL du site statique lui-même.
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://projetsportnature.onrender.com/api
      - key: EXPO_NO_BUNDLE_SPLITTING
        value: "1"
