# Copie de secours du workflow CI (à coller dans .github/workflows/ci.yml
# via l’UI GitHub si le token local n’a pas le scope « workflow »).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: node --check src/server.js src/routes/api.js src/auth.js src/db/database.js
      - run: node scripts/smoke-api.js
